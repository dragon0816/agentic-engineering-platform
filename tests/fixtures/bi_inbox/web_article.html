<h1>RedCap 模組出貨量今年成長三倍</h1>
<p>（虛構範例）市調機構指出，5G RedCap 模組今年出貨量預估成長三倍，主要來自智慧手錶、工業感測器與影像監控。</p>
<p>多家模組廠表示，RedCap 降低了頻寬與天線數量的要求，讓成本接近 LTE Cat-4，因此許多原本使用 LTE 的產品開始轉換。</p>
<h2>測試需求</h2>
<ul><li>RF 一致性測試</li><li>省電模式（eDRX）驗證</li><li>電信商認證</li></ul>
<p>業者預期明年將有更多工業應用導入，電信商認證時程會是上市的關鍵。</p>
