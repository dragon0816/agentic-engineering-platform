name: Hand local Codex repair to Hermes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: codex-local-handoff-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  handoff:
    if: >
      vars.CODEX_EXECUTION_MODE == 'local-worker' &&
      vars.CODEX_LOCAL_WORKER_USER != '' &&
      github.actor == vars.CODEX_LOCAL_WORKER_USER &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codex/remote-test-issue-') &&
      contains(github.event.pull_request.body || '', '<!-- codex-local-fix/v1 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Publish the exact-SHA Hermes retest request
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const marker = String(pull.body || "").match(
              /<!-- codex-local-fix\/v1 source_issue=(\d+) request_id=([A-Za-z0-9._-]+) -->/
            );
            if (!marker) {
              core.setFailed("The local worker PR marker is invalid.");
              return;
            }
            const sourceIssue = Number(marker[1]);
            const requestId = marker[2];
            const id = `codex-local-retest-${pull.number}-${pull.head.sha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              per_page: 100,
            });
            if (comments.some((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              String(comment.body || "").includes(`\"id\":\"${id}\"`)
            )) {
              core.notice(`Hermes request ${id} already exists.`);
              return;
            }
            const payload = {
              schema: "hermes-next-action/v1",
              producer: "github-actions[bot]",
              id,
              action: "retest_draft_pr",
              repository: `${context.repo.owner}/${context.repo.repo}`,
              source_issue: sourceIssue,
              source_request_id: requestId,
              pull_request: pull.number,
              pull_request_url: pull.html_url,
              head_sha: pull.head.sha,
              required_check: "verify",
            };
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "hermes-retest-requested",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "hermes-retest-requested",
                color: "1d76db",
                description: "Requests a bounded Hermes retest of an exact Draft PR SHA.",
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              body: [
                "## Hermes Next Action",
                `<!-- ${JSON.stringify(payload)} -->`,
                "",
                "Hermes: rebuild and retest this exact head commit using the source Issue acceptance criteria.",
                "Do not approve or merge this PR.",
              ].join("\n\n"),
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              labels: ["hermes-retest-requested"],
            });
