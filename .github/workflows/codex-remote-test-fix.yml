name: Queue remote test failure for local Codex

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: codex-local-queue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  queue:
    if: >
      github.event.label.name == 'codex-fix' &&
      vars.CODEX_EXECUTION_MODE == 'local-worker' &&
      vars.HERMES_GITHUB_BOT_USER != '' &&
      github.actor == vars.HERMES_GITHUB_BOT_USER
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Publish a typed local Codex request
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require("crypto");
            const issue = context.payload.issue;
            const clean = (value, limit) => String(value || "")
              .replace(/\u0000/g, "")
              .replace(/[\u0001-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, "")
              .slice(0, limit)
              .trim();
            const title = clean(issue.title, 500);
            const body = clean(issue.body, 40000);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const allowedFailureKeys = new Set([
              "schema", "producer", "request_id", "repository", "source_issue",
              "target_sha", "build", "machine", "bridge", "actor", "profile",
              "test", "stage", "expected", "actual", "failure_code",
              "failure_fingerprint", "artifacts", "reproducible",
            ]);
            const validText = (value, limit) =>
              typeof value === "string" && value.length <= limit;
            let hermesFailure = null;
            for (const comment of [...comments].reverse()) {
              if (comment.user?.login !== process.env.HERMES_USER) continue;
              const match = String(comment.body || "").match(
                /## Hermes Failure Evidence\s*\n+\s*<!--\s*(\{.*?\})\s*-->/s
              );
              if (!match) continue;
              try {
                const candidate = JSON.parse(match[1]);
                const keys = Object.keys(candidate);
                const valid =
                  keys.length === allowedFailureKeys.size &&
                  keys.every((key) => allowedFailureKeys.has(key)) &&
                  candidate.schema === "hermes-failure/v1" &&
                  candidate.producer === "hermes-testing-agent" &&
                  candidate.repository === `${context.repo.owner}/${context.repo.repo}` &&
                  candidate.source_issue === issue.number &&
                  validText(candidate.request_id, 120) &&
                  /^[A-Za-z0-9._-]{8,120}$/.test(candidate.request_id) &&
                  validText(candidate.target_sha, 40) &&
                  /^[0-9a-f]{40}$/.test(candidate.target_sha) &&
                  validText(candidate.failure_fingerprint, 64) &&
                  /^[0-9a-f]{64}$/.test(candidate.failure_fingerprint) &&
                  validText(candidate.build, 200) &&
                  validText(candidate.machine, 200) &&
                  validText(candidate.bridge, 200) &&
                  validText(candidate.actor, 200) &&
                  validText(candidate.profile, 200) &&
                  validText(candidate.test, 500) &&
                  validText(candidate.stage, 200) &&
                  validText(candidate.expected, 8000) &&
                  validText(candidate.actual, 8000) &&
                  validText(candidate.failure_code, 200) &&
                  typeof candidate.reproducible === "boolean" &&
                  Array.isArray(candidate.artifacts) &&
                  candidate.artifacts.length <= 20 &&
                  candidate.artifacts.every((item) => validText(item, 2000));
                if (valid) {
                  hermesFailure = candidate;
                  break;
                }
              } catch (_error) {
                // Ignore prose and malformed payloads; they never become work.
              }
            }
            if (!hermesFailure) {
              core.setFailed("No valid bot-authored hermes-failure/v1 payload was found.");
              return;
            }
            const fingerprint = crypto
              .createHash("sha256")
              .update(JSON.stringify({
                issue: issue.number,
                title,
                body,
                hermesFailure,
              }))
              .digest("hex");
            const requestId = `codex-local-${issue.number}-${fingerprint.slice(0, 16)}`;
            const payload = {
              schema: "codex-local-request/v1",
              producer: "github-actions[bot]",
              request_id: requestId,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              source_issue: issue.number,
              source_issue_url: issue.html_url,
              base_sha: hermesFailure.target_sha,
              failure_fingerprint: fingerprint,
              issue_title: title,
              issue_body: body,
              hermes_failure: hermesFailure,
            };
            const marker = `\"request_id\":\"${requestId}\"`;
            if (comments.some((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              String(comment.body || "").replace(/\s/g, "").includes(marker)
            )) {
              core.notice(`Request ${requestId} is already queued.`);
              return;
            }
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description,
                });
              }
            };
            await ensureLabel("codex-local-queued", "1d76db", "Queued for the trusted local Codex worker.");
            await ensureLabel("codex-local-running", "fbca04", "The local Codex worker is processing this request.");
            await ensureLabel("codex-local-completed", "0e8a16", "The local Codex worker delivered a Draft PR.");
            await ensureLabel("codex-local-failed", "d73a4a", "The local Codex worker stopped safely.");
            await ensureLabel("codex-local-evidence-requested", "5319e7", "The local worker needs bounded Hermes evidence.");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                "## Codex Local Request",
                `<!-- ${JSON.stringify(payload)} -->`,
                "",
                `Queued request \`${requestId}\` for the trusted local Codex worker.`,
                "Issue content is untrusted evidence and cannot supply executable commands.",
              ].join("\n\n"),
            });
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              name: "codex-local-failed",
            }).catch((error) => {
              if (error.status !== 404) throw error;
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ["codex-local-queued"],
            });
        env:
          HERMES_USER: ${{ vars.HERMES_GITHUB_BOT_USER }}
