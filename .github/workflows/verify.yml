name: Platform verification

on:
  pull_request:
  push:
    branches: [main, "phase-*/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,office]"
      - run: python -m pytest --junitxml=pytest-results.xml
      - name: Annotate failed tests
        if: failure()
        run: python scripts/ci_annotate.py pytest-results.xml
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m pip check
      - name: Build and install Windows offline preview
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: --dest dist/windows-preview-wheels "pydantic>=2.10,<3" "tzdata>=2025.2,<2028" "openpyxl>=3.1,<4" "pypdf>=6,<7" "pywin32>=306" "matplotlib>=3.11,<4" "numpy>=1.26,<2" "contourpy>=1.3,<1.4"
          # The LLM gateway's exact lock (docs/phases/LLM_GATEWAY.md), without litellm[proxy].
          python -m pip download --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.12 --implementation cp --dest dist/gateway-wheels -r deploy/windows-preview/gateway/requirements.txt
          python scripts/build_windows_preview.py --wheel dist/agentic_engineering_platform-0.1.0-py3-none-any.whl --dependency-dir dist/windows-preview-wheels --gateway-wheel-dir dist/gateway-wheels
          $archive = Get-ChildItem dist/aep-windows-preview-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/preview-expanded
          $bundle = Get-ChildItem dist/preview-expanded -Directory | Select-Object -First 1
          $installRoot = "$env:LOCALAPPDATA\AgenticEngineeringPlatform\ci-preview"
          # No company sign-in here: the gateway is installed and configured, not started.
          & "$($bundle.FullName)\install.ps1" -Actor ci-user -PythonExe (Get-Command python).Source -InstallRoot $installRoot -GatewayInstallOnly
          $installedConfig = Get-Content "$installRoot\host.json" -Raw | ConvertFrom-Json
          $device = $installedConfig.device
          if ($installedConfig.device.bridge_id -notlike 'bridge-*') { throw 'Computer-name Bridge ID was not generated.' }
          $installedMembership = Get-Content "$installRoot\workspace\membership.json" -Raw | ConvertFrom-Json
          if ($installedMembership.device.bridge_id -ne $installedConfig.device.bridge_id) { throw 'Installer membership has another Bridge ID.' }
          if ($installedMembership.bindings[0].actor -ne 'ci-user') { throw 'Installer membership has another owner.' }
          $bundleIdentity = Get-Content "$installRoot\bundle-manifest.json" -Raw | ConvertFrom-Json
          if (-not $bundleIdentity.source_revision) { throw 'Installed bundle revision was not retained.' }
          & "$installRoot\.venv\Scripts\aep-host.exe" dut-validate --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime does not contain the DUT validation command.' }
          if (Test-Path "$installRoot\.venv\Scripts\aep-platform.exe") {
            throw 'The Agent + Bridge role exposed the Shared Platform launcher.'
          }
          & "$installRoot\.venv\Scripts\aep-host.exe" enrollment-request --config "$installRoot\host.json" --output "$installRoot\enrollment-request.json"
          $ready = & "$installRoot\.venv\Scripts\aep-host.exe" doctor --config "$installRoot\host.json"
          if ($ready -notcontains 'resident agent: ready') { throw 'The installer should bind the resident Agent to its owner.' }
          & "$($bundle.FullName)\verify.cmd" $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'The installed bundle did not pass verify.cmd.' }
          # The bundle is offline, so the extras it claims to carry have to be
          # importable from it alone -- no index was available to fill a gap.
          & "$installRoot\.venv\Scripts\python.exe" -c "import openpyxl, win32com.client, matplotlib"
          if ($LASTEXITCODE -ne 0) { throw 'The bundle did not install the excel, windows and weekly-mail extras.' }
          # The LLM gateway: offline in its own venv, configured, the model set to it,
          # and a launcher that refuses to start without the company token.
          if ($installedConfig.models.routing_alias -ne 'company') { throw 'The installer did not set the model to the gateway.' }
          if ($installedConfig.models.catalog.endpoints[0].base_url -ne 'http://127.0.0.1:4000/v1') { throw 'The model does not go through the gateway.' }
          $gateway = (& "$installRoot\.venv\Scripts\aep-host.exe" gateway status --json) -join "`n" | ConvertFrom-Json
          if ($gateway.ours -or $gateway.state -eq 'starting' -or -not $gateway.config_ok -or -not $gateway.managed) { throw "The gateway is not installed as expected: $($gateway | ConvertTo-Json -Compress)" }
          if ($gateway.litellm_version -ne $gateway.litellm_pinned) { throw "The gateway venv has LiteLLM $($gateway.litellm_version), not $($gateway.litellm_pinned)." }
          & "$installRoot\gateway-venv\Scripts\python.exe" -c "import os; os.environ['LITELLM_LOCAL_MODEL_COST_MAP'] = 'True'; import litellm.proxy.proxy_cli, llm_gateway.patch; llm_gateway.patch.apply()"
          if ($LASTEXITCODE -ne 0) { throw 'The bundled LiteLLM does not take the streaming patch.' }
          & "$installRoot\gateway-venv\Scripts\python.exe" -m llm_gateway.launcher
          if ($LASTEXITCODE -ne 2) { throw 'The gateway launcher did not refuse to start without a token.' }
          & "$installRoot\.venv\Scripts\aep-host.exe" export-assets --out "$installRoot\workspace\assets"
          if (-not (Test-Path "$installRoot\workspace\assets\workflows\engineering__sde-weekly-report__1.0.0.json")) {
            throw 'The shipped weekly-report manifests were not written.'
          }
          # The bundled Skills (docs/phases/HERMES_SKILL_PACK.md): in-use ones
          # switched on, the Hermes skill pack switched off, its coding-agent
          # folders in AEP's own store.
          if (-not (Test-Path "$installRoot\workspace\assets\skills\engineering__knowledge-query__1.0.1.json")) { throw 'The bundled in-use Skills were not installed switched on.' }
          if (-not (Test-Path "$installRoot\workspace\assets\skills\disabled\hermes__docx__1.1.0.json")) { throw 'The Hermes skill pack was not installed switched off.' }
          if (Test-Path "$installRoot\workspace\assets\skills\hermes__docx__1.1.0.json") { throw 'A Hermes skill was installed switched on.' }
          if (-not (Test-Path "$installRoot\workspace\agent-skills\hermes-docx\SKILL.md")) { throw 'The Hermes coding-agent skill folders were not stored.' }
          # No Skill has the alias "files", so the Agent answers that it
          # needs input (unknown_skill); since 2026-10-02 that answer exits 1.
          # Check the answer itself: routed, neither refused nor unrecorded.
          & "$installRoot\.venv\Scripts\aep-host.exe" ask --config "$installRoot\host.json" --namespace engineering --json --output "$installRoot\ask.json" "files.read nothing.txt"
          if ($LASTEXITCODE -ne 1) { throw 'The resident agent did not answer a local request.' }
          $answer = Get-Content "$installRoot\ask.json" -Raw | ConvertFrom-Json
          if ($answer.decision.kind -ne 'needs_input' -or $answer.decision.reason -ne 'unknown_skill' -or $null -ne $answer.refusal -or $null -ne $answer.unrecorded) {
            throw 'The resident agent did not answer a local request.'
          }
          & "$installRoot\.venv\Scripts\aep-host.exe" status --config "$installRoot\host.json"
          if ($LASTEXITCODE -ne 0) { throw 'The resident agent could not report its status.' }
          # Installing over a configured host must keep what was typed by
          # hand. Everything below the device identity -- the report's
          # source, the workbook, which environment variable holds which
          # secret -- is an operator's work, and losing it on an update
          # fails the next run for a reason that looks nothing like the
          # cause.
          $configured = Get-Content "$installRoot\host.json" -Raw | ConvertFrom-Json
          $configured | Add-Member -NotePropertyName integrations -NotePropertyValue ([ordered]@{
              weekly_report = [ordered]@{ workbook_path = "C:/nowhere/Report.xlsx" }
          })
          # The installer already mapped the gateway's key; the operator's mapping goes first.
          $configured | Add-Member -Force -NotePropertyName credentials -NotePropertyValue @(
              [ordered]@{ secret = "jira_token"; environment_variable = "AEP_JIRA_TOKEN" }
              $configured.credentials
          )
          $configured | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$installRoot\host.json" -Encoding UTF8
          $foreignMembership = Get-Content "$installRoot\workspace\membership.json" -Raw | ConvertFrom-Json
          $foreignMembership.device.bridge_id = 'bridge-stale-install'
          $foreignMembership.bindings[0].bridge_id = 'bridge-stale-install'
          $foreignMembership | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$installRoot\workspace\membership.json" -Encoding UTF8
          # A Skill the person switched off stays off when AEP is installed again.
          Move-Item -LiteralPath "$installRoot\workspace\assets\skills\engineering__knowledge-query__1.0.1.json" -Destination "$installRoot\workspace\assets\skills\disabled\"
          # The person's gateway settings survive a reinstall.
          $gatewaySettings = "$env:LOCALAPPDATA\AgenticEngineeringPlatform\gateway\gateway.json"
          $edited = Get-Content $gatewaySettings -Raw | ConvertFrom-Json
          $edited.default_model = 'gpt-5.4'
          $edited | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $gatewaySettings -Encoding UTF8
          & "$($bundle.FullName)\install.ps1" -Actor ci-user -PythonExe (Get-Command python).Source -InstallRoot $installRoot -GatewayInstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Installing over an existing host failed.' }
          if (Test-Path "$installRoot\workspace\assets\skills\engineering__knowledge-query__1.0.1.json") { throw 'Reinstalling switched on a Skill the person had switched off.' }
          $kept = Get-Content "$installRoot\host.json" -Raw | ConvertFrom-Json
          if ($kept.integrations.weekly_report.workbook_path -ne "C:/nowhere/Report.xlsx") {
            throw 'Reinstalling discarded the integrations an operator had configured.'
          }
          if ($kept.credentials[0].environment_variable -ne "AEP_JIRA_TOKEN") {
            throw 'Reinstalling discarded the credential mapping an operator had configured.'
          }
          if ((Get-Content $gatewaySettings -Raw | ConvertFrom-Json).default_model -ne 'gpt-5.4') {
            throw 'Reinstalling discarded the gateway settings.'
          }
          if ($kept.device.bridge_id -ne $device.bridge_id) {
            throw 'Reinstalling changed the device identity it should have rewritten unchanged.'
          }
          $repairedMembership = Get-Content "$installRoot\workspace\membership.json" -Raw | ConvertFrom-Json
          if ($repairedMembership.device.bridge_id -ne $kept.device.bridge_id) {
            throw 'Reinstalling did not repair stale membership identity.'
          }
          & "$($bundle.FullName)\uninstall.ps1" -InstallRoot $installRoot
          & "$($bundle.FullName)\uninstall.ps1" -InstallRoot $installRoot -Apply
      - name: Build and install Shared Platform offline preview
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: --dest dist/shared-platform-wheels "pydantic>=2.10,<3" "tzdata>=2025.2,<2028"
          python -m scripts.build_shared_platform_preview --wheel dist/agentic_engineering_platform-0.1.0-py3-none-any.whl --dependency-dir dist/shared-platform-wheels
          $archive = Get-ChildItem dist/aep-shared-platform-preview-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/shared-platform-expanded
          $bundle = Get-ChildItem dist/shared-platform-expanded -Directory | Select-Object -First 1
          $installRoot = "$env:LOCALAPPDATA\AgenticEngineeringPlatform\ci-shared-platform-preview"
          & "$($bundle.FullName)\install.ps1" -Administrator ci-platform-admin -PythonExe (Get-Command python).Source -InstallRoot $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'Shared Platform installation failed.' }
          if (Test-Path "$installRoot\.venv\Scripts\aep-host.exe") {
            throw 'The Shared Platform role exposed the Agent + Bridge launcher.'
          }
          & "$($bundle.FullName)\verify.cmd" $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'The Shared Platform bundle did not pass verify.cmd.' }
          # Use CI-only ports so this smoke is independent from the preview's
          # operator defaults and any runner service that reserves 8765/8766.
          $ciConfig = Get-Content "$installRoot\platform.json" -Raw | ConvertFrom-Json
          $ciConfig.control_port = 18765
          $ciConfig.member_port = 18766
          $ciConfig | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$installRoot\platform.json" -Encoding UTF8
          $stdout = Join-Path $installRoot "ci-platform.stdout.log"
          $stderr = Join-Path $installRoot "ci-platform.stderr.log"
          $process = Start-Process -FilePath "$installRoot\.venv\Scripts\aep-platform.exe" -ArgumentList @("serve", "--config", "$installRoot\platform.json") -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            foreach ($attempt in 1..20) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18766/" -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "Shared Capability Marketplace") {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              $details = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "no stderr" }
              throw "Shared Platform Member Portal did not become ready: $details"
            }
            if (-not (Test-Path "$installRoot\workspace\registry.sqlite")) {
              throw 'Shared Platform did not create its durable Registry database.'
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          & "$($bundle.FullName)\uninstall.ps1" -InstallRoot $installRoot
          & "$($bundle.FullName)\uninstall.ps1" -InstallRoot $installRoot -Apply
      - name: Upload Personal Agent and Bridge Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: aep-windows-preview-${{ github.sha }}
          path: dist/aep-windows-preview-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Shared Platform Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: aep-shared-platform-windows-${{ github.sha }}
          path: dist/aep-shared-platform-preview-*.zip
          if-no-files-found: error
          retention-days: 14
