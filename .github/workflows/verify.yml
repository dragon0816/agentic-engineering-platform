name: Platform verification

on:
  pull_request:
  push:
    branches: [main, "phase-*/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,office]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m pip check
      - name: Build and install Windows offline preview
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: --dest dist/windows-preview-wheels "pydantic>=2.10,<3" "openpyxl>=3.1,<4" "pywin32>=306"
          python scripts/build_windows_preview.py --wheel dist/agentic_engineering_platform-0.1.0-py3-none-any.whl --dependency-dir dist/windows-preview-wheels
          $archive = Get-ChildItem dist/aep-windows-preview-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/preview-expanded
          $bundle = Get-ChildItem dist/preview-expanded -Directory | Select-Object -First 1
          $installRoot = "$env:LOCALAPPDATA\AgenticEngineeringPlatform\ci-preview"
          & "$($bundle.FullName)\install.ps1" -Actor ci-user -PythonExe (Get-Command python).Source -InstallRoot $installRoot
          $installedConfig = Get-Content "$installRoot\host.json" -Raw | ConvertFrom-Json
          if ($installedConfig.device.bridge_id -notlike 'bridge-*') { throw 'Computer-name Bridge ID was not generated.' }
          & "$installRoot\.venv\Scripts\aep-host.exe" enrollment-request --config "$installRoot\host.json" --output "$installRoot\enrollment-request.json"
          $pending = & "$installRoot\.venv\Scripts\aep-host.exe" doctor --config "$installRoot\host.json"
          if ($pending -notcontains 'resident agent: pending') { throw 'A freshly installed host should report a pending resident agent.' }
          # The bundle is offline, so the extras it claims to carry have to be
          # importable from it alone -- no index was available to fill a gap.
          & "$installRoot\.venv\Scripts\python.exe" -c "import openpyxl, win32com.client"
          if ($LASTEXITCODE -ne 0) { throw 'The bundle did not install the excel and windows extras.' }
          & "$installRoot\.venv\Scripts\aep-host.exe" export-assets --out "$installRoot\workspace\assets"
          if (-not (Test-Path "$installRoot\workspace\assets\workflows\engineering__jira-weekly-report__1.0.0.json")) {
            throw 'The shipped weekly-report manifests were not written.'
          }
          $device = $installedConfig.device
          $membership = [ordered]@{
              device = $device
              bindings = @([ordered]@{ bridge_id = $device.bridge_id; actor = $device.registered_by; role = "operator" })
          }
          $membership | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$installRoot\workspace\membership.json" -Encoding UTF8
          $ready = & "$installRoot\.venv\Scripts\aep-host.exe" doctor --config "$installRoot\host.json"
          if ($ready -notcontains 'resident agent: ready') { throw 'A host that knows its members should report a ready resident agent.' }
          & "$installRoot\.venv\Scripts\aep-host.exe" ask --config "$installRoot\host.json" --namespace engineering "files.read nothing.txt"
          if ($LASTEXITCODE -ne 0) { throw 'The resident agent did not answer a local request.' }
          & "$installRoot\.venv\Scripts\aep-host.exe" status --config "$installRoot\host.json"
          if ($LASTEXITCODE -ne 0) { throw 'The resident agent could not report its status.' }
          # Installing over a configured host must keep what was typed by
          # hand. Everything below the device identity -- the report's
          # source, the workbook, which environment variable holds which
          # secret -- is an operator's work, and losing it on an update
          # fails the next run for a reason that looks nothing like the
          # cause.
          $configured = Get-Content "$installRoot\host.json" -Raw | ConvertFrom-Json
          $configured | Add-Member -NotePropertyName integrations -NotePropertyValue ([ordered]@{
              weekly_report = [ordered]@{ workbook_path = "C:/nowhere/Report.xlsx" }
          })
          $configured | Add-Member -NotePropertyName credentials -NotePropertyValue @(
              [ordered]@{ secret = "jira_token"; environment_variable = "AEP_JIRA_TOKEN" }
          )
          $configured | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$installRoot\host.json" -Encoding UTF8
          & "$($bundle.FullName)\install.ps1" -Actor ci-user -PythonExe (Get-Command python).Source -InstallRoot $installRoot
          if ($LASTEXITCODE -ne 0) { throw 'Installing over an existing host failed.' }
          $kept = Get-Content "$installRoot\host.json" -Raw | ConvertFrom-Json
          if ($kept.integrations.weekly_report.workbook_path -ne "C:/nowhere/Report.xlsx") {
            throw 'Reinstalling discarded the integrations an operator had configured.'
          }
          if ($kept.credentials[0].environment_variable -ne "AEP_JIRA_TOKEN") {
            throw 'Reinstalling discarded the credential mapping an operator had configured.'
          }
          if ($kept.device.bridge_id -ne $device.bridge_id) {
            throw 'Reinstalling changed the device identity it should have rewritten unchanged.'
          }
          & "$($bundle.FullName)\uninstall.ps1" -InstallRoot $installRoot
          & "$($bundle.FullName)\uninstall.ps1" -InstallRoot $installRoot -Apply
      - name: Upload Windows technical preview
        uses: actions/upload-artifact@v4
        with:
          name: aep-windows-preview-${{ github.sha }}
          path: dist/aep-windows-preview-*.zip
          if-no-files-found: error
          retention-days: 14
