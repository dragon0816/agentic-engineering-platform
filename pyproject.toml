[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-engineering-platform"
version = "0.1.0"
description = "Provider-neutral engineering platform foundation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "tzdata>=2025.2,<2028"]

[project.scripts]
aep-host = "host_runtime.cli:main"
aep-platform = "control_plane.cli:main"
aep-local-codex-worker = "development.codex_worker:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "build>=1.2,<2",
    # Stubs for openpyxl (Apache-2.0), so the workbook reader type-checks.
    "types-openpyxl>=3.1,<4",
]
# Reading a workbook without Excel (Phase 7 slice 3a). Named on its own so a
# company Bridge running the weekly report installs a spreadsheet reader and
# not the whole PDF/PPTX/DOCX stack; `office` includes it.
excel = ["openpyxl>=3.1,<4"]
# Office extraction (Phase 4 slice 3); licenses recorded in docs/PHASE_4_MIGRATION.md.
# openpyxl (MIT) reads the weekly workbook without Excel (Phase 7 slice 3a);
# recorded in docs/PHASE_7_MIGRATION.md.
office = ["pypdf[image]>=6,<7", "python-pptx>=1,<2", "python-docx>=1,<2", "openpyxl>=3.1,<4"]
# The Excel writer on a company workstation (Phase 7 slice 3b). pywin32 is
# permissively licensed (PSF-style) and Windows-only; the adapter imports it
# lazily, so every other host installs and runs without it.
windows = ["pywin32>=306"]
# The source Workflow 11's one-image pie/member chart is generated only for
# mail drafts; hosts that do not use this workflow need no plotting stack.
weekly-mail = ["matplotlib>=3.11,<4", "numpy>=1.26,<2", "contourpy>=1.3,<1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The chipset report's ruleset is data the package ships, not configuration a
# host has to supply: a host may point at its own file, and without one the
# shipped default is what runs.
"*" = ["py.typed", "*.json", "*.cs"]
# Agent Web avatar frames (owner 2026-10-07), cut by scripts/slice_avatars.py.
# The creator Skills an external coding agent installs (EXTERNAL_AUTHORING X4).
# The AEP Agent shortcut icon (owner 2026-10-13), made by scripts/make_icon.py.
"host_runtime" = ["avatars/*.png", "avatars/*.json", "creators/*/SKILL.md", "icons/*.ico"]
# The skill writing guide and templates the Knowledge page and its Skill assistant show.
"knowledge" = ["skill_guide/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# `gui`: drives windows on the desktop (keyboard, mouse focus). Skipped unless
# AEP_GUI_TESTS=1, so a plain run never takes over the owner's screen (2026-10-07).
markers = ["gui: drives desktop windows; runs only with AEP_GUI_TESTS=1"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Migrated source jobs are vendored byte-identical and hash-verified; never reformat them.
# Benchmark runs are recorded agent output kept as evidence (prompts, traces and
# the scripts an agent wrote, some deliberately broken); never lint or reformat them.
# The NCC rules are the source module verbatim apart from its imports, and
# tests/test_rs_w14_ncc_plan.py compares the two text for text; keep its layout.
extend-exclude = [
    "packages/*/*/vendor",
    "benchmarks/*/runs",
    "src/capabilities/ncc_plan/rules.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Long lines inside text these files emit verbatim: the PowerShell UI Automation
# script the smoke check runs, and the frozen fixture prompts whose bytes the
# fixture manifest hashes. Re-wrapping either would change what they produce.
[tool.ruff.lint.per-file-ignores]
"benchmarks/business_workflow_lab/operator/smoke.py" = ["E501"]
"benchmarks/coding_v1/fixtures/build_fixtures.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# lxml ships no stubs; it is reached only through the typed office libraries.
[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

# pywin32 ships no stubs and is imported lazily by the one Excel adapter,
# which the suite never exercises (docs/TASKS.md records that), and by the
# coding runner's restricted execution (exercised on Windows).
[[tool.mypy.overrides]]
module = [
    "win32com", "win32com.*", "pythoncom", "win32api", "win32con", "win32event",
    "win32file", "win32job", "win32process", "win32security",
]
ignore_missing_imports = true
